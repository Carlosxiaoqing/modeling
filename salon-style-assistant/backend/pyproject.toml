[project]
name = "salon-style-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pillow>=11,<14",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "alembic>=1.14,<2",
    "openai>=1.0,<3",
    "volcengine-ark-runtime>=5.0,<6",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
